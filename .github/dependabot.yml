version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Work lands on dev; main only takes dev when it is released.
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: bun
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
