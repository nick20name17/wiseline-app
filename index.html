<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wiseline PM</title>
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('ui-theme') || 'system'
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- qrcodejs 1.0.0, vendored from the CDN copy the prototype pins: the Stock Cards page has to
         draw the same code, and a classic script is the only thing this library publishes -->
    <script src="/qrcode.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
