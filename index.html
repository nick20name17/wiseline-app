<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Wiseline PM — production scheduling and order tracking across Trim, Rollforming and Shipping."
    />
    <title>Wiseline PM</title>
    <meta name="theme-color" content="#ffffff" />
    <script>
      ;(() => {
        let t
        try {
          t = localStorage.getItem('theme')
        } catch {}
        const dark =
          t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', dark ? '#0a0a0a' : '#ffffff')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
